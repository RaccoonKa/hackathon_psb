services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - ASSISTANT_BACKEND=rag
      - DATABASE_URL=sqlite:////app/storage/chat.db
      - DATA_DIR=/app/data
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-http://127.0.0.1:8082/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-local}
      - EMBEDDING_TIMEOUT=${EMBEDDING_TIMEOUT:-180}
      - RERANKER_MODEL=${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./models:/app/models:ro
    env_file:
      - path: .env
        required: false
    command: >
      sh -c "if [ ! -f /app/data/manifests/indexing_manifest.json ]; then
               echo 'Indexing manifest not found, running build_index.py...';
               python build_index.py || true;
             fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
